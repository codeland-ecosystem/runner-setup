worker_processes  1;

error_log logs/error.log notice;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name _;

        location / {
            # Use LXC DNS to resolve container names. __LXC_BRIDGE_DNS__ is
            # substituted by host-setup.sh with the actual bridge IP.
            resolver __LXC_BRIDGE_DNS__;

            # Initialize the target variable
            set $target '';

            access_by_lua_block {
                local host_str = ngx.var.host or ""

                -- 1. Isolate the first segment (everything before the first dot)
                local dot_pos = string.find(host_str, "%.")
                local prefix = dot_pos and string.sub(host_str, 1, dot_pos - 1) or host_str

                -- 2. Check for underscore within that prefix ONLY
                local underscore_pos = string.find(prefix, "_")

                if underscore_pos then
                    -- New Format: 7681_crunner0-production-36106
                    local port = string.sub(prefix, 1, underscore_pos - 1)
                    local container = string.sub(prefix, underscore_pos + 1)
                    ngx.var.target = container .. ":" .. port
                else
                    -- Default Format: crunner0-production-36106 (Defaults to port 80)
                    ngx.var.target = prefix .. ":80"
                end

                -- Optional: Uncomment the line below to debug mapping in error.log
                -- ngx.log(ngx.NOTICE, "Request Host: ", host_str, " -> Target: ", ngx.var.target)
            }

            # Proxy settings
            proxy_pass http://$target;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
